name: Build and Push Docker Image

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "*.*.*"

env:
  GCR_REGISTRY: asia.gcr.io
  GCR_IMAGE_NAME: fastwork-cloud/fw-reward-web

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Google Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.GCR_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCR_JSON_KEY }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.GCR_REGISTRY }}/${{ env.GCR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Repository Dispatch for Staging - TH
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: fastworkco/kustomize-conf
          event-type: set-image
          client-payload: '{"path": "fw-reward-web/overlays/staging", "image":  "${{ env.GCR_REGISTRY }}/${{ env.GCR_IMAGE_NAME }}:${{ steps.meta.outputs.version }}", "app": "fw-reward-web", "env": "staging", "version": "${{ steps.meta.outputs.version }}"}'

      - name: Repository Dispatch for Staging - ID
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: fastworkco/kustomize-conf
          event-type: set-image
          client-payload: '{"path": "fw-reward-web/overlays/staging-id", "image":  "${{ env.GCR_REGISTRY }}/${{ env.GCR_IMAGE_NAME }}:${{ steps.meta.outputs.version }}", "app": "fw-reward-web", "env": "staging-id", "version": "${{ steps.meta.outputs.version }}"}'

      - name: Repository Dispatch for Staging - VN
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: fastworkco/kustomize-conf
          event-type: set-image
          client-payload: '{"path": "fw-reward-web/overlays/staging-vn", "image":  "${{ env.GCR_REGISTRY }}/${{ env.GCR_IMAGE_NAME }}:${{ steps.meta.outputs.version }}", "app": "fw-reward-web", "env": "staging-vn", "version": "${{ steps.meta.outputs.version }}"}'
